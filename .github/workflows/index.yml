# Publishing index.json — the catalog with each entry's current version filled
# in.
#
# Why this job exists rather than the obvious alternative: a client could ask
# GitHub for each installed plugin's latest release directly, and that would
# work. It would also mean every install continuously telling a third party
# exactly which plugins it runs. So the asking happens here, once, and a client
# fetches the WHOLE file with no query string, no install id and no list of
# what it has, and diffs locally. What an install runs stays its own business
# by construction rather than by policy.
#
# Nobody edits index.json. A catalog that has not published one yet still
# works: clients fall back to plugins.json and report "cannot tell" rather than
# "up to date".

name: index

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [plugins.json]

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask each repository what its latest release is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out='[]'
          count=$(jq 'length' plugins.json)
          for i in $(seq 0 $((count - 1))); do
            entry=$(jq ".[$i]" plugins.json)
            id=$(echo "$entry" | jq -r .id)
            repo=$(echo "$entry" | jq -r .repo)

            # A repository that has gone away, or has no release yet, is not an
            # error here. It means the version is unknown, and an entry with no
            # version is exactly what a client already copes with — it reports
            # that it cannot tell, which is true, instead of guessing.
            version=$(gh release view --repo "$repo" --json tagName -q .tagName 2>/dev/null || true)
            if [ -n "$version" ]; then
              entry=$(echo "$entry" | jq --arg v "${version#v}" '. + {version: $v}')
              echo "$id -> ${version#v}"
            else
              echo "$id -> (no release)"
            fi
            out=$(echo "$out" | jq --argjson e "$entry" '. + [$e]')
          done
          echo "$out" | jq . > index.json

      - name: Commit it, if it moved
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  'cogitorium-catalog'
          git config user.email 'noreply@github.com'
          git add index.json
          git commit -m 'index: refresh versions'
          git push
